# ============================================================
#  zgrnf 音乐飞行插件 配置文件
#  所有选项都带中文注释,修改后执行 /zgrnf reload 立即生效,
#  无需重启服务器。
# ============================================================

# ---- 放行规则 ----
# mode 控制哪些玩家可以使用 zgrnf 飞行(需同时安装 zgrnf 客户端 mod):
#   whitelist : 仅下方 whitelist 列表中的玩家可用
#   blacklist : 除下方 blacklist 列表中的玩家外,其他玩家都可用
#   off       : 所有玩家都可用(默认)
mode: off

# 白名单(填小写玩家名)
whitelist: []
# 黑名单(填小写玩家名)
blacklist: []

# ---- 飞行 ----
# flight-mode 飞行模式:
#   creative : 创造原生飞行(推荐,手感最稳)。播放音乐时获得飞行能力,
#              玩家双击空格起飞,飞行速度随音量变化(音量 100% 时达到
#              maxFlySpeed),和创造模式的手感一致,暂停音乐即取消。
#   jetpack  : 喷气背包模式。播放音乐时获得飞行能力,玩家双击空格起飞后
#              会持续喷气上升(推力随音量增强),身上会冒音符粒子;
#              想降落就再次双击空格取消飞行,或暂停音乐。
flight-mode: creative

# maxFlySpeed 最大飞行速度(即音量 100% 时的飞行速度)。
# 原版创造模式约为 0.05,建议范围 0.05 ~ 0.5,值过大会难以操控。
maxFlySpeed: 0.05

# jetpack-power 喷气背包推力系数(仅 jetpack 模式有效),范围 0.1 ~ 1.0。
# 数值越大,喷气越猛、爬升越快。
jetpack-power: 0.5

# ---- 特效 ----
# particles 是否在玩家飞行时给其播放音符粒子特效(播放音乐飞行时非常搭)。
particles: true
