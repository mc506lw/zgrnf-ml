name: zgrnf
version: '${version}'

main: mc506lw.zgrnf.Zgrnf
api-version: '1.20'
folia-supported: true
load: POSTWORLD
description: Companion plugin for the zgrnf Fabric mod. Grants flight while the client plays music.
author: mc506lw

commands:
  zgrnf:
    description: zgrnf 管理命令
    usage: /zgrnf reload|list|mode <whitelist|blacklist|off>|whitelist add|remove|list <玩家>|blacklist add|remove|list <玩家>
    permission: zgrnf.admin
    permission-message: 你没有权限使用此命令

permissions:
  zgrnf.admin:
    description: 使用 zgrnf 管理命令
    default: op
